<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gitfolio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>body{margin:0;background:#0a0a0a;word-break:keep-all;overflow-wrap:break-word;} a{color:#fafafa;text-decoration:underline;text-decoration-color:rgba(255,255,255,0.3);} a:hover{color:#d4d4d4;} input[type=radio]{accent-color:#fafafa;}</style>
<link rel="stylesheet" href="motion.css">
</head>
<body>
<div style="font-family:Pretendard,-apple-system,sans-serif;background:#0a0a0a;color:#fafafa;min-height:100vh;display:flex;">
  <aside style="width:232px;flex-shrink:0;background:#111111;border-right:1px solid rgba(255,255,255,0.08);padding:24px 16px;display:flex;flex-direction:column;gap:4px;">
    <div style="font-size:18px;font-weight:800;padding:8px 12px;margin-bottom:16px;">Gitfolio</div>
    <a href="dashboard.html" style="color:#a3a3a3;font-size:14px;padding:10px 12px;border-radius:8px;white-space:nowrap;text-decoration:none;display:block;">대시보드</a>
    <a href="repolist.html" style="color:#a3a3a3;font-size:14px;padding:10px 12px;border-radius:8px;white-space:nowrap;text-decoration:none;display:block;">저장소</a>
    <a href="timeline.html" style="color:#a3a3a3;font-size:14px;padding:10px 12px;border-radius:8px;white-space:nowrap;text-decoration:none;display:block;">타임라인</a>
    <a href="troubleshooting.html" style="color:#a3a3a3;font-size:14px;padding:10px 12px;border-radius:8px;white-space:nowrap;text-decoration:none;display:block;">트러블슈팅</a>
    <a href="retrospective.html" style="color:#a3a3a3;font-size:14px;padding:10px 12px;border-radius:8px;white-space:nowrap;text-decoration:none;display:block;">회고</a>
    <a href="export.html" style="color:#a3a3a3;font-size:14px;padding:10px 12px;border-radius:8px;white-space:nowrap;text-decoration:none;display:block;">내보내기</a>
    <a href="settings.html" style="background:rgba(255,255,255,0.08);color:#fafafa;font-weight:700;font-size:14px;padding:10px 12px;border-radius:8px;white-space:nowrap;text-decoration:none;display:block;">설정</a>
    <div style="margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid rgba(255,255,255,0.08);padding-top:16px;">
      <div style="width:28px;height:28px;border-radius:50%;background:#fafafa;flex-shrink:0;"></div>
      <div style="font-size:13px;">yuna-kim</div>
    </div>
  </aside>

  <main style="flex:1;padding:40px 48px;max-width:900px;">
    <h1 style="font-size:24px;font-weight:800;margin:0 0 32px;">설정</h1>

    <div style="font-size:15px;font-weight:700;margin-bottom:14px;">GitHub 설정</div>
    <div style="background:#171717;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:24px;margin-bottom:32px;">
      <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid rgba(255,255,255,0.08);">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="width:36px;height:36px;border-radius:50%;background:#fafafa;"></div>
          <div><div style="font-weight:700;font-size:14px;">yuna-kim</div><div style="font-size:12px;color:#737373;">연결됨 · github.com/yuna-kim</div></div>
        </div>
        <button style="background:transparent;color:#ef4444;border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;">연결 해제</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:6px 0;">
        <span>비공개 저장소 접근 권한</span>
        <div style="width:40px;height:22px;background:#fafafa;border-radius:11px;position:relative;"><div style="width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;right:2px;top:2px;"></div></div>
      </div>
    </div>

    <div style="font-size:15px;font-weight:700;margin-bottom:14px;">분석 설정</div>
    <div style="background:#171717;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:24px;margin-bottom:32px;">
      <div style="font-size:13px;color:#a3a3a3;margin-bottom:12px;">분석 우선순위</div>
      <div style="display:flex;gap:10px;margin-bottom:20px;">
        <label style="display:flex;align-items:center;gap:8px;background:#111111;border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:10px 16px;font-size:13px;"><input type="radio">비용 우선</label>
        <label style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);border:1px solid #fafafa;border-radius:8px;padding:10px 16px;font-size:13px;"><input type="radio" checked>균형 모드</label>
        <label style="display:flex;align-items:center;gap:8px;background:#111111;border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:10px 16px;font-size:13px;"><input type="radio">정확도 우선</label>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:10px 0;border-top:1px solid rgba(255,255,255,0.08);">
        <span>Merge Commit 기본 포함</span>
        <div style="width:40px;height:22px;background:rgba(255,255,255,0.1);border-radius:11px;position:relative;"><div style="width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;left:2px;top:2px;"></div></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:10px 0;">
        <span>자동 생성 파일 기본 제외</span>
        <div style="width:40px;height:22px;background:#fafafa;border-radius:11px;position:relative;"><div style="width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;right:2px;top:2px;"></div></div>
      </div>
    </div>

    <div style="font-size:15px;font-weight:700;margin-bottom:14px;">데이터 설정</div>
    <div style="background:#171717;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:24px;margin-bottom:32px;display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:14px;"><span>분석 완료 후 코드 원문 자동 삭제</span>
        <div style="width:40px;height:22px;background:#fafafa;border-radius:11px;position:relative;"><div style="width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;right:2px;top:2px;"></div></div>
      </div>
      <button style="text-align:left;background:transparent;border:none;color:#a3a3a3;font-size:14px;padding:0;cursor:pointer;">저장소별 분석 데이터 삭제</button>
      <button style="text-align:left;background:transparent;border:none;color:#ef4444;font-size:14px;padding:0;cursor:pointer;">전체 분석 데이터 삭제</button>
      <button style="text-align:left;background:transparent;border:none;color:#ef4444;font-size:14px;padding:0;cursor:pointer;">계정 탈퇴</button>
    </div>

    <div style="font-size:15px;font-weight:700;margin-bottom:14px;">화면 설정</div>
    <div style="background:#171717;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:14px;"><span>테마</span><span style="color:#737373;">다크 모드만 지원</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:14px;">
        <span>코드 폰트 크기</span>
        <div style="display:flex;gap:6px;">
          <span style="color:#a3a3a3;padding:6px 12px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);font-size:12px;">작게</span>
          <span style="background:rgba(255,255,255,0.10);color:#fafafa;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;">보통</span>
          <span style="color:#a3a3a3;padding:6px 12px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);font-size:12px;">크게</span>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="motion.js"></script>
</body>
</html>
