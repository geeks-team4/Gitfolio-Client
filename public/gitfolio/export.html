<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gitfolio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>body{margin:0;background:#0a0a0a;word-break:keep-all;overflow-wrap:break-word;} a{color:#fafafa;text-decoration:underline;text-decoration-color:rgba(255,255,255,0.3);} a:hover{color:#d4d4d4;} input[type=checkbox]{accent-color:#fafafa;}</style>
<link rel="stylesheet" href="motion.css">
</head>
<body>
<div style="font-family:Pretendard,-apple-system,sans-serif;background:#0a0a0a;color:#fafafa;min-height:100vh;display:flex;">
  <aside style="width:232px;flex-shrink:0;background:#111111;border-right:1px solid rgba(255,255,255,0.08);padding:24px 16px;display:flex;flex-direction:column;gap:4px;">
    <div style="font-size:18px;font-weight:800;padding:8px 12px;margin-bottom:16px;">Gitfolio</div>
    <a href="dashboard.html" style="color:#a3a3a3;font-size:14px;padding:10px 12px;border-radius:8px;white-space:nowrap;text-decoration:none;display:block;">대시보드</a>
    <a href="repolist.html" style="color:#a3a3a3;font-size:14px;padding:10px 12px;border-radius:8px;white-space:nowrap;text-decoration:none;display:block;">저장소</a>
    <a href="timeline.html" style="color:#a3a3a3;font-size:14px;padding:10px 12px;border-radius:8px;white-space:nowrap;text-decoration:none;display:block;">타임라인</a>
    <a href="troubleshooting.html" style="color:#a3a3a3;font-size:14px;padding:10px 12px;border-radius:8px;white-space:nowrap;text-decoration:none;display:block;">트러블슈팅</a>
    <a href="retrospective.html" style="color:#a3a3a3;font-size:14px;padding:10px 12px;border-radius:8px;white-space:nowrap;text-decoration:none;display:block;">회고</a>
    <a href="export.html" style="background:rgba(255,255,255,0.08);color:#fafafa;font-weight:700;font-size:14px;padding:10px 12px;border-radius:8px;white-space:nowrap;text-decoration:none;display:block;">내보내기</a>
    <a href="settings.html" style="color:#a3a3a3;font-size:14px;padding:10px 12px;border-radius:8px;white-space:nowrap;text-decoration:none;display:block;">설정</a>
    <div style="margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid rgba(255,255,255,0.08);padding-top:16px;">
      <div style="width:28px;height:28px;border-radius:50%;background:#fafafa;flex-shrink:0;"></div>
      <div style="font-size:13px;">yuna-kim</div>
    </div>
  </aside>

  <main style="flex:1;padding:40px 48px;max-width:900px;">
    <h1 style="font-size:24px;font-weight:800;margin:0 0 6px;">내보내기</h1>
    <div style="font-size:14px;color:#a3a3a3;margin-bottom:32px;">외부 공개 페이지는 제공하지 않아요. 필요한 내용만 파일로 내보낼 수 있어요.</div>

    <div style="font-size:13px;font-weight:700;color:#a3a3a3;margin-bottom:14px;">내보낼 내용</div>
    <div style="display:flex;flex-direction:column;gap:1px;background:rgba(255,255,255,0.08);border-radius:12px;overflow:hidden;margin-bottom:28px;">
      <label style="background:#171717;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;font-size:14px;"><span>전체 커밋 분석</span><input type="checkbox" checked></label>
      <label style="background:#171717;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;font-size:14px;"><span>기간별 개발 기록</span><input type="checkbox" checked></label>
      <label style="background:#171717;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;font-size:14px;"><span>기능별 개발 기록</span><input type="checkbox"></label>
      <label style="background:#171717;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;font-size:14px;"><span>트러블슈팅 모음</span><input type="checkbox" checked></label>
      <label style="background:#171717;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;font-size:14px;"><span>프로젝트 회고 (상세 개발 회고)</span><input type="checkbox" checked></label>
      <label style="background:#171717;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;font-size:14px;"><span>면접 예상 질문</span><input type="checkbox"></label>
    </div>

    <div style="font-size:13px;font-weight:700;color:#a3a3a3;margin-bottom:14px;">파일 형식</div>
    <div style="display:flex;gap:10px;margin-bottom:32px;">
      <span style="background:rgba(255,255,255,0.10);color:#fafafa;font-size:14px;font-weight:700;padding:10px 20px;border-radius:8px;white-space:nowrap;">PDF</span>
      <span style="color:#a3a3a3;font-size:14px;padding:10px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);">Markdown</span>
      <span style="color:#a3a3a3;font-size:14px;padding:10px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);">JSON</span>
      <span style="color:#a3a3a3;font-size:14px;padding:10px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);">텍스트 복사</span>
    </div>

    <button style="background:#fafafa;color:#0a0a0a;border:none;border-radius:8px;padding:14px 28px;font-size:14px;font-weight:700;cursor:pointer;">gitfolio-web · 개발 기록.pdf 내보내기</button>
  </main>
</div>
<script src="motion.js"></script>
</body>
</html>
