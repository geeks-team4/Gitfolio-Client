<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gitfolio</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>body{margin:0;background:#0a0b0d;word-break:keep-all;overflow-wrap:break-word;} a{color:#22c55e;text-decoration:none;} a:hover{color:#4ade80;} textarea{font-family:inherit;}</style>
<link rel="stylesheet" href="motion.css">
</head>
<body>
<div style="font-family:Pretendard,-apple-system,sans-serif;background:#0a0b0d;color:#f2f3f5;min-height:100vh;display:flex;">
  <aside style="width:232px;flex-shrink:0;background:#0e0f12;border-right:1px solid rgba(255,255,255,0.08);padding:24px 16px;display:flex;flex-direction:column;gap:4px;">
    <div style="font-size:18px;font-weight:800;padding:8px 12px;margin-bottom:16px;">Gitfolio</div>
    <div style="color:#9aa1ac;font-size:14px;padding:10px 12px;border-radius:8px;">대시보드</div>
    <div style="background:rgba(34,197,94,0.12);color:#22c55e;font-weight:700;font-size:14px;padding:10px 12px;border-radius:8px;">저장소</div>
    <div style="color:#9aa1ac;font-size:14px;padding:10px 12px;border-radius:8px;">타임라인</div>
    <div style="color:#9aa1ac;font-size:14px;padding:10px 12px;border-radius:8px;">트러블슈팅</div>
    <div style="color:#9aa1ac;font-size:14px;padding:10px 12px;border-radius:8px;">회고</div>
    <div style="color:#9aa1ac;font-size:14px;padding:10px 12px;border-radius:8px;">내보내기</div>
    <div style="color:#9aa1ac;font-size:14px;padding:10px 12px;border-radius:8px;">결제/이용내역</div>
    <div style="color:#9aa1ac;font-size:14px;padding:10px 12px;border-radius:8px;">설정</div>
    <div style="margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid rgba(255,255,255,0.08);padding-top:16px;">
      <div style="width:28px;height:28px;border-radius:50%;background:#22c55e;flex-shrink:0;"></div>
      <div style="font-size:13px;">yuna-kim</div>
    </div>
  </aside>

  <main style="flex:1;padding:36px 48px;max-width:920px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
      <div>
        <div style="font-size:13px;color:#6b7280;margin-bottom:6px;font-family:monospace;">a3f21c9 · "로그인 완성" 분석 결과 편집</div>
        <h1 style="font-size:22px;font-weight:800;margin:0;">분석 결과 편집</h1>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="font-size:12px;color:#6b7280;">자동 저장됨 · 방금 전</span>
        <select style="background:#15171c;border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:8px 12px;color:#f2f3f5;font-size:13px;font-family:inherit;">
          <option>사용자 확인 완료</option>
          <option>사용자 확인 필요</option>
          <option>잘못된 분석</option>
          <option>분석 제외</option>
        </select>
      </div>
    </div>

    <div style="background:#15171c;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:24px;margin-bottom:20px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
        <div style="font-size:13px;font-weight:700;color:#9aa1ac;">AI 분석 문장</div>
        <button style="background:transparent;border:1px solid rgba(255,255,255,0.08);color:#9aa1ac;font-size:12px;padding:5px 10px;border-radius:6px;cursor:pointer;">재생성</button>
      </div>
      <textarea style="width:100%;height:120px;background:#0e0f12;border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:14px;color:#f2f3f5;font-size:14px;line-height:1.7;resize:none;box-sizing:border-box;">로그인 화면 구현과 함께 이메일/비밀번호 형식 검증, 인증 API 연결, 토큰 저장까지 한 번에 커밋되었습니다. 로그인 실패 시 사용자에게 오류 메시지를 보여주는 처리가 함께 추가되었습니다.</textarea>
    </div>

    <div style="background:#15171c;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:24px;margin-bottom:20px;">
      <div style="font-size:13px;font-weight:700;color:#9aa1ac;margin-bottom:10px;">사용자 기억 추가</div>
      <textarea placeholder="AI가 놓친 맥락이나 직접 기억하는 내용을 적어주세요" style="width:100%;height:80px;background:#0e0f12;border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:14px;color:#f2f3f5;font-size:14px;resize:none;box-sizing:border-box;">사실 이 로그인 화면은 팀원이 만든 템플릿을 참고해서 직접 다시 짠 거였음. API 연결은 처음 해본 거라 시간 오래 걸렸음.</textarea>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;background:#15171c;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:20px 24px;margin-bottom:24px;">
      <div style="font-size:14px;">기간 그룹</div>
      <select style="background:#0e0f12;border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:8px 12px;color:#f2f3f5;font-size:13px;font-family:inherit;">
        <option>2023.04–06 · 핵심 기능 구현</option>
      </select>
    </div>

    <div style="display:flex;justify-content:space-between;">
      <button style="background:transparent;color:#9aa1ac;border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:12px 20px;font-size:14px;cursor:pointer;">수정 전 내용 복원</button>
      <button style="background:#22c55e;color:#0a0b0d;border:none;border-radius:8px;padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer;">저장</button>
    </div>
  </main>
</div>
<script src="motion.js"></script>
</body>
</html>
