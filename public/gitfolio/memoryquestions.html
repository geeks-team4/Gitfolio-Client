<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gitfolio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>body{margin:0;background:#0a0a0a;word-break:keep-all;overflow-wrap:break-word;} a{color:#fafafa;text-decoration:underline;text-decoration-color:rgba(255,255,255,0.3);} a:hover{color:#d4d4d4;} textarea{font-family:inherit;}</style>
<link rel="stylesheet" href="motion.css">
</head>
<body>
<div style="font-family:Pretendard,-apple-system,sans-serif;background:#0a0a0a;color:#fafafa;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px;">
  <div style="width:560px;">
    <div style="text-align:center;margin-bottom:28px;">
      <div style="font-size:13px;color:#fafafa;font-weight:700;margin-bottom:10px;">기억 보완 질문 · 3 / 6</div>
      <h1 style="font-size:20px;font-weight:800;margin:0;">분석만으로 확인하기 어려운 내용이에요</h1>
    </div>

    <div style="background:#171717;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:32px;margin-bottom:16px;">
      <div style="font-size:12px;color:#737373;margin-bottom:10px;">order-service · 2025.05.10 커밋 4b9e110 관련</div>
      <div style="font-size:17px;font-weight:700;margin-bottom:20px;line-height:1.5;">API 응답 구조를 변경한 이유를 기억하시나요?</div>
      <textarea placeholder="자유롭게 적어주세요. 건너뛰어도 괜찮아요." style="width:100%;height:110px;background:#111111;border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:14px;color:#fafafa;font-size:14px;resize:none;box-sizing:border-box;"></textarea>
    </div>

    <div style="display:flex;justify-content:space-between;">
      <button style="background:transparent;color:#a3a3a3;border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:12px 20px;font-size:14px;cursor:pointer;">건너뛰기</button>
      <div style="display:flex;gap:8px;">
        <button style="background:transparent;color:#a3a3a3;border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:12px 20px;font-size:14px;cursor:pointer;">이전</button>
        <button style="background:#fafafa;color:#0a0a0a;border:none;border-radius:8px;padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer;">다음</button>
      </div>
    </div>

    <div style="display:flex;gap:6px;justify-content:center;margin-top:24px;">
      <div style="width:24px;height:4px;border-radius:2px;background:#fafafa;"></div>
      <div style="width:24px;height:4px;border-radius:2px;background:#fafafa;"></div>
      <div style="width:24px;height:4px;border-radius:2px;background:#fafafa;"></div>
      <div style="width:24px;height:4px;border-radius:2px;background:rgba(255,255,255,0.1);"></div>
      <div style="width:24px;height:4px;border-radius:2px;background:rgba(255,255,255,0.1);"></div>
      <div style="width:24px;height:4px;border-radius:2px;background:rgba(255,255,255,0.1);"></div>
    </div>
  </div>
</div>
<script src="motion.js"></script>
</body>
</html>
